<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/output.css" />
    <title>Habit Tracker - DOM Study Case (Tailwind)</title>

    <!-- Font Google -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-200 flex justify-center items-center min-h-screen m-0">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
      <h2 class="text-2xl font-bold text-blue-400 text-center mb-6">Habit Tracker</h2>

      <div class="flex gap-2 mb-6">
        <input
          type="text"
          id="habitInput"
          placeholder="Masukkan habit baru..."
          class="flex-1 px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-slate-200 outline-none focus:border-blue-400 transition-colors"
        />
        <button
          id="addBtn"
          class="px-4 py-2 bg-blue-500 hover:bg-blue-400 text-slate-900 font-semibold rounded-lg transition-all active:scale-95 shadow-lg shadow-blue-500/20"
        >
          Tambah
        </button>
      </div>

      <ul id="habitList" class="flex flex-col gap-2"></ul>
    </div>

    <script src="./scripts/script.js"></script>
  </body>
</html>
