<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMCC To-Do App - Daftar</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
        <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight text-center mb-2">Daftar Akun</h2>
        <p class="text-slate-500 text-sm text-center mb-6">Buat akun baru untuk mulai mengatur tugas kuliah.</p>
        
        <div id="error-message" class="bg-red-500 text-white p-3 rounded-xl text-sm font-medium mb-4 hidden"></div>
        <div id="success-message" class="bg-green-500 text-white p-3 rounded-xl text-sm font-medium mb-4 hidden"></div>

        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Nama Lengkap</label>
                <input type="text" id="reg-name" placeholder="Contoh: Budi Santoso" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Email</label>
                <input type="email" id="reg-email" placeholder="nama@email.com" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Password</label>
                <input type="password" id="reg-password" placeholder="Minimal 8 karakter" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>
            <button type="submit" id="btn-register" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md shadow-indigo-100">Daftar Akun</button>
        </form>
        <p class="text-sm text-center text-slate-500 mt-6">Sudah punya akun? <a href="index.html" class="text-indigo-600 font-semibold hover:underline">Login disini</a></p>
    </div>
    <script src="./../js/config.js"></script>
    <script src="./../js/app.js"></script>
</body>
</html>
