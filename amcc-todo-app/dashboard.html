<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMCC To-Do App - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased py-12 px-4">
    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">📝 AMCC To-Do</h1>
                <p class="text-slate-500 text-xs mt-0.5">Selamat datang di ruang kerjamu</p>
            </div>
            <button id="btn-logout" class="text-xs bg-rose-50 text-rose-600 hover:bg-rose-100 font-bold px-3 py-2 rounded-xl transition">Keluar</button>
        </header>
        
        <div id="error-message" class="bg-red-500 text-white p-4 rounded-2xl font-medium shadow-lg shadow-red-100 mb-6 hidden"></div>

        <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-8">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Buat Catatan Baru</h2>
            <form id="todo-form" class="space-y-4">
                <div>
                    <input type="text" id="task-title" placeholder="Contoh: Kerjakan modul Asinkronus AMCC" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <button type="submit" id="btn-submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition">Tambah Catatan</button>
            </form>
        </section>

        <section class="space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Daftar Tugas Terkunci Token</h2>
            <div id="loading" class="text-center text-sm text-slate-400 py-6">⏳ Mengamankan data dengan token JWT...</div>
            <div id="task-list" class="space-y-3"></div>
        </section>
    </div>
    <script src="./../js/config.js"></script>
    <script src="./../js/app.js"></script>
</body>
</html>
